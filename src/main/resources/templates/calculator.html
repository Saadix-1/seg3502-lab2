<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" /></head>
<body>
<div>
    <h1>Calculator</h1>
    <div th:switch="${error}">
        <p th:case="'NumberFormatError'">
            Wrong value provided - must be a number
        </p>
        <p th:case="'OperationFormatError'">
            Wrong operation
        </p>
    </div>
    <form th:action="@{/calculate}" method="get">
        <table>
            <tr>
                <td><label for="num1">Premier nombre:</label></td>
                <td><input name="num1"
                           id="num1"
                           th:name="num1" th:value="${num1}"></td>
            </tr>
            <tr>
                <td><label for="num2">Second nombre:</label></td>
                <td><input name="num2"
                           id="num2"
                           th:name="num2" th:value="${num2}"></td>
            </tr>
            <tr>
                <td><label for="result">Resultat:</label></td>
                <td><input name="result"
                           id="result"
                           th:value="${result}" readonly></td>
            </tr>
            <tr>
                <td>
                    <button type="submit" th:name="operation" th:value="'+'">+</button>
                    <button type="submit" th:name="operation" th:value="'-'">-</button>
                    <button type="submit" th:name="operation" th:value="'*'">*</button>
                    <button type="submit" th:name="operation" th:value="'/'">/</button>
                </td>
            </tr>
        </table>
    </form>
</div>
</body>
</html></title>
</head>
<body>

</body>
</html>
